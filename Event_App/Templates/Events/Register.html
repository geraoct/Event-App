{% extends 'base.html'%}


{% block content %}
<div class="register p-4 d-flex flex-column justify-content-center align-items-center">
<div class="register-form p-4 rounded shadow mb-3" style="min-width: 300px;max-width: 500px; width: 100%;">
<h1 class="d-flex justify-content-center align-items-center">Register Here</h1>
<hr>

<form method="post">
{% csrf_token %}
{{ form.as_p }}
<div class="text-center text-dark p-3"></div>
<button class="btn btn-outline-dark" type="submit">Register</button>
<span>I already have an account</span>
<a href="{% url 'login' %}" style="color: black;">Login</a>
</form>
</div>
</div>
</div>
{% endblock %}
